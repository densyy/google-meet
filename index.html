<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Entrar no Meet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <main>
    <h1>Entrar no Meet</h1>

    <!-- Minhas salas -->
    <section id="salas-section" class="salas-section hidden" aria-label="Minhas salvas">
      <h2>Minhas salas</h2>
      <p class="salas-hint">Toque numa sala para entrar</p>
      <div id="salas-list" class="salas-list"></div>
    </section>

    <!-- Entrar em nova reunião -->
    <section class="novo-section">
      <h2 class="novo-label">Entrar em uma nova reunião</h2>
      <div class="input-row">
        <input
          type="text"
          id="codigo-input"
          placeholder="Ex.: abc-defg-hij"
          aria-label="Código que alguém te enviou"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        >
        <button id="btn-colar" class="btn-colar" type="button" aria-label="Colar código copiado">
          <i class="fa-solid fa-paste"></i> Colar
        </button>
      </div>
      <button id="btn-entrar" class="btn-entrar" type="button">Entrar</button>
      <div id="feedback" class="feedback" aria-live="polite" role="status"></div>
    </section>

    <!-- Ajuda -->
    <button id="btn-ajuda" class="btn-ajuda" type="button">
      <span class="btn-ajuda-circle">?</span> Onde encontro esse código?
    </button>

    <!-- Resgate -->
    <div id="resgate" class="resgate hidden" role="alert">
      <p>Nada aconteceu? Toque aqui para entrar pela internet.</p>
      <a id="resgate-link" href="#" class="btn-resgate">Entrar pela internet</a>
    </div>

  </main>

  <!-- Toast (gerenciado por componente) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal container (gerenciado por componente) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <h3 id="modal-titulo" class="modal-titulo"></h3>
      <div id="modal-conteudo" class="modal-conteudo"></div>
      <div id="modal-botoes" class="modal-botoes"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
